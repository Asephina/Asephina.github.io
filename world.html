<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script src="assets/gate.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>予你的人间 · 纳凌薇</title>
<meta name="description" content="这世界的苦厄与微明。她爱这世界，所以两样都要让她看见。">
<link rel="stylesheet" href="assets/site.css?v=v7">
</head>
<body>

<canvas id="bg"></canvas>
<div class="wrap page">

  <div class="page-head">
    <h1>予你的人间</h1>
    <p>这里不放我自己的事。放的是这世上正在发生的苦难，和同一批人做出来的好事。</p>
    <blockquote class="page-quote">
      「花开」　意义在于创造而非赋予，追寻而非抵达。即便世界令人失望至极，依旧选择爱与花开——花开即是回答。
    </blockquote>
  </div>

  <div class="page-rule"></div>

  <h2 class="sec icon">
    <svg class="sec-icon" viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
      <circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor"
              stroke-width="1.7" stroke-linecap="round"
              stroke-dasharray="46 8" transform="rotate(-90 12 12)"/>
    </svg>Suffering
  </h2>
  <div class="timeline" id="hard"></div>

  <h2 class="sec icon">
    <svg class="sec-icon" viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
      <line x1="12" y1="21.2" x2="12" y2="3.4" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round"/>
      <line x1="12" y1="21.2" x2="12" y2="3.4" stroke="currentColor"
            stroke-width="3.4" stroke-linecap="round" opacity=".22"/>
    </svg>Glimmer
  </h2>
  <div class="timeline" id="warm"></div>

</div>

<div id="foot"></div>
<script src="assets/site.js?v=v7"></script>
<script src="assets/life.js?v=v7"></script>
<script>
LM.shell();

// 目录格式：{ hard: [文件名…], warm: [文件名…] }
// 也兼容旧格式（一个纯数组，全部算作「苦」）。
function readList(idx, key) {
    if (!idx) return [];
    if (idx instanceof Array) return key === 'hard' ? idx : [];
    var v = idx[key];
    return v instanceof Array ? v : [];
}

function render(boxId, list, emptyText) {
    var box = document.getElementById(boxId);
    if (!list.length) { box.innerHTML = '<div class="empty">' + emptyText + '</div>'; return Promise.resolve(); }
    return Promise.all(list.map(function (e) {
        var name = (typeof e === 'string') ? e : (e && e.file) || '';
        if (!name || name.charAt(0) === '_') return Promise.resolve(null);
        return LM.json('world/' + name).then(function (j) { return j || null; });
    })).then(function (rows) {
        var ok = rows.filter(function (r) { return r; });
        if (!ok.length) { box.innerHTML = '<div class="empty">' + emptyText + '</div>'; return; }
        box.innerHTML = ok.map(function (r) {
            return '<div class="tl-item">' +
                '<div class="when">' + LM.esc(r.date || '') +
                (r.place ? '　·　' + LM.esc(r.place) : '') + '</div>' +
                '<h3>' + LM.esc(r.title || '') + '</h3>' +
                (r.content ? '<p>' + LM.esc(r.content) + '</p>' : '') +
                '</div>';
        }).join('');
    });
}

LM.json('world/index.json').then(function (idx) {
    render('hard', readList(idx, 'hard'), '暂无记录');
    render('warm', readList(idx, 'warm'), '暂无记录');
});
</script>
</body>
</html>
